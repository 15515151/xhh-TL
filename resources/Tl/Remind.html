<!doctype html>
<html>

<head>
  <meta http-equiv="content-type" content="text/html;charset=utf-8" />
  <link rel="stylesheet" type="text/css" href="{{ppath}}Tl/tl.css" />
  <link rel="stylesheet" type="text/css" href="{{ppath}}Tl/widget.css" />
  <link rel="stylesheet" type="text/css" href="{{ppath}}Tl/remind.css" />
  <style id="rem-root">html { font-size: {{scalePx}}px; }</style>
</head>

<body>
  <div class="rm-wrap">
    <div class="rm-card rm-{{d.game}}">
      <!-- 顶部立绘横幅（沿用体力卡同款：模糊填充 + 清晰立绘 + 压暗） -->
      <div class="rm-banner">
        {{if d.portrait}}
        <div class="rm-banner-fill" style="background-image: url({{d.portrait}})"></div>
        <div class="rm-banner-portrait" style="background-image: url({{d.portrait}})"></div>
        {{/if}}
        <div class="rm-banner-shade"></div>
        <div class="rm-gear">⚙</div>
        <div class="rm-topbar">
          {{if d.uid}}<div class="rm-chip">UID {{d.uid}}</div>{{/if}}
        </div>
        <div class="rm-logo">{{d.game == 'sr' ? 'STAR RAIL' : d.game == 'zzz' ? 'ZENLESS' : d.game == 'ww' ? 'WUTHERING' : 'GENSHIN'}}</div>
      </div>

      <!-- 单条状态：质变仪 / 洞天宝钱 -->
      <div class="rm-body">
        <div class="rm-row">
          <div class="rm-icon" style="background-image: url({{ppath}}Tl/imgs/{{d.icon}})"></div>
          <div class="rm-name">{{d.name}}</div>
          {{if d.bar}}
          <div class="rm-val {{d.bar.warn ? 'warn' : ''}}">{{d.bar.cur}}<i>/{{d.bar.max}}</i></div>
          {{else}}
          <div class="rm-sub {{d.ok ? 'ready' : ''}}">{{d.text}}</div>
          {{/if}}
        </div>
        {{if d.bar}}
        <div class="rm-track">
          <div class="rm-fill {{d.bar.warn ? 'warn' : ''}}" style="width: {{d.bar.pct}}%"></div>
        </div>
        {{/if}}
      </div>
    </div>
  </div>
</body>

</html>
